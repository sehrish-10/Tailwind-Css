<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Tailwind Practice</title>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center">

  <div class="bg-white w-80 rounded-2xl shadow-lg p-6 text-center">

    <div class="w-20 h-20 bg-pink-100 rounded-full mx-auto flex items-center justify-center">
      <span class="text-3xl">🌸</span>
    </div>

    <h1 class="text-2xl font-bold text-gray-800 mt-4">
      Hello, Sehrish!
    </h1>

    <p class="text-gray-500 mt-2">
      Keep learning Tailwind CSS and building beautiful websites.
    </p>

    <button
      class="mt-5 bg-pink-500 text-white px-6 py-2 rounded-full
             hover:bg-pink-600 hover:scale-105
             transition duration-300"
    >
      Explore
    </button>

  </div>

</body>
</html>
